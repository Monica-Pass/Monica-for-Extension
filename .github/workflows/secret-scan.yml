name: Secret Scan

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * 4"

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Include verified, unverified, and unknown findings (do not restrict to verified-only).
      # Scheduled, manual and new-branch runs scan the full history, so reviewed synthetic
      # fixtures are excluded by exact path in .github/secret-scan-exclude-paths.txt.
      # Lob is excluded because its pattern (test_ + 35 word characters) matches long
      # snake_case Rust test names and its verifier reports them as live. Monica has no
      # Lob integration. scripts/verify-workflows.mjs keeps both exclusions narrow.
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: 3.95.9
          extra_args: --exclude-paths=.github/secret-scan-exclude-paths.txt --exclude-detectors=Lob
