[package]
name = "monica-mdbx2-host"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]
exclude = ["vendor/mdbx", "vendor/mdbx/crates/*"]

[dependencies]
base64 = "0.22"
fs2 = "=0.4.3"
md-5 = "0.10"
mdbx-core = { path = "vendor/mdbx/crates/mdbx-core" }
mdbx-ffi = { path = "vendor/mdbx/crates/mdbx-ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
uniffi = "=0.31.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
zip = { version = "=2.4.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
mdbx-storage = { path = "vendor/mdbx/crates/mdbx-storage", default-features = false, features = ["core", "filesystem-blob-store"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
