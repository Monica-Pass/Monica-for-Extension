[package]
name = "monica-mdbx2-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
mdbx-ffi = { git = "https://github.com/Monica-Pass/Mdbx.git", rev = "aafa22f195c626a8d8288d712bf42bccea134847" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "=0.31.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
