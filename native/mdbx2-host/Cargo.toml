[package]
name = "monica-mdbx2-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
md-5 = "0.10"
mdbx-ffi = { git = "https://github.com/Monica-Pass/Mdbx.git", rev = "aafa22f195c626a8d8288d712bf42bccea134847" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uniffi = "=0.31.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
mdbx-storage = { git = "https://github.com/Monica-Pass/Mdbx.git", rev = "aafa22f195c626a8d8288d712bf42bccea134847", default-features = false, features = ["core", "filesystem-blob-store"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
