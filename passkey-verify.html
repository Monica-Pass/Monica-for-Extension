<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <title>Monica · Passkey</title>
  </head>
  <body>
    <main>
      <header><img src="/icons/logo-256.png" width="40" height="40" alt="Monica" /><span>MONICA / PASSKEY</span></header>
      <h1 data-message="验证身份"></h1>
      <section aria-labelledby="site-label">
        <p id="site-label" class="label" data-message="正在访问的网站"></p>
        <strong id="site"></strong>
        <p id="account"></p>
      </section>
      <form>
        <p class="hint" data-message="输入 Monica 主密码，确认本次 Passkey 操作。"></p>
        <label for="password" data-message="Monica 主密码"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="4096" required autofocus />
        <p id="status" role="status" aria-live="polite"></p>
        <footer>
          <button id="cancel" type="button" data-message="取消"></button>
          <button id="confirm" type="submit" data-message="确认"></button>
        </footer>
      </form>
    </main>
    <script type="module" src="/src/passkey/verification-page.ts"></script>
  </body>
</html>
